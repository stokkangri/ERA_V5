name: Deploy Session 8 timeline

# Before first success: Repo Settings → Pages → Build and deployment → Source: GitHub Actions
on:
  push:
    branches: [main]
    paths:
      - "S8/attention-timeline/**"
      - ".github/workflows/deploy-s8.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: S8/attention-timeline
      - id: deployment
        uses: actions/deploy-pages@v4
